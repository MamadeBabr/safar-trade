version: "2"
sql:
  - engine: "postgresql"
    schema: "../migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp with time zone"
            go_type: "time.Time"
          - column: "notes.user_id"
            go_type:
              type: "int64"
              pointer: true
